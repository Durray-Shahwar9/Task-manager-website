
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
                <h1>TaskFlow<span>.</span></h1>
                <p class="subtitle">Small steps. Big achievements.</p>
            </div>
            <div class="date-card">
                <span>STAY FOCUSED</span>
                <strong id="task-count">0 tasks</strong>
            </div>
        </header>

        <section class="panel">
            <h2>What's on your list?</h2>
            <form id="task-form">
                <label for="task-input">New task</label>
                <div class="input-row">
                    <input id="task-input" type="text"
                           placeholder="e.g. Complete my web project"
                           maxlength="200" required>
                    <button type="submit" id="add-button">+ Add Task</button>
                </div>
                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="tasks-section">
            <div class="section-heading">
                <div>
                    <h2>My Tasks</h2>
                    <p>Make today count.</p>
                </div>
                <div class="filters" aria-label="Filter tasks">
                    <button class="filter active" data-filter="all"
                            aria-pressed="true">All</button>
                    <button class="filter" data-filter="pending"
                            aria-pressed="false">Pending</button>
                    <button class="filter" data-filter="completed"
                            aria-pressed="false">Completed</button>
                </div>
            </div>

            <ul id="task-list" aria-label="Your tasks"></ul>
            <p id="empty-state" class="empty">
                No tasks here yet. Add your first task above!
            </p>
        </section>

        <footer>Built with HTML, CSS, JavaScript & Python</footer>
    </main>
</body>
</html>
